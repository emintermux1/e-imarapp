name: Mobile Flutter (legacy)

on:
  pull_request:
    paths:
      - "legacy/apps/e_imar_mobile/**"
      - ".github/workflows/mobile-flutter.yml"
  push:
    branches:
      - main
    paths:
      - "legacy/apps/e_imar_mobile/**"
      - ".github/workflows/mobile-flutter.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/apps/e_imar_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build bundle --debug
      - run: flutter build apk --debug --dart-define=E_IMAR_GATEWAY_BASE_URL=http://10.0.2.2:3000 --dart-define=E_IMAR_ENV=ci
</ぞparameter>
