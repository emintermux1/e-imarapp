name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/e_imar_web/package-lock.json
      - run: npm ci --prefix apps/e_imar_web
      - run: npm run typecheck --prefix apps/e_imar_web
      - run: npm run build --prefix apps/e_imar_web

  deploy-vercel:
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/e_imar_web
          vercel-args: "--prod"

  deploy-summary:
    needs:
      - verify
      - deploy-vercel
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy status
        run: |
          echo "Verify: ${{ needs.verify.result }}"
          echo "Vercel: ${{ needs.deploy-vercel.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            exit 1
          fi
